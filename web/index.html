<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global 3D Isometric Weather Widget</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --hud-bg: rgba(45, 65, 84, 0.84);
      --hud-border: rgba(255, 255, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans", system-ui, sans-serif; }
    body {
      background: #0d1b2a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .widget-frame {
      position: relative;
      width: min(96vw, 960px);
      aspect-ratio: 1376 / 768;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      border: 1.5px solid rgba(188, 224, 247, 0.65);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-card {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 280px;
      background: var(--hud-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      padding: 14px 16px;
      user-select: none;
    }
    .hud-condition { font-size: 13px; font-weight: 700; letter-spacing: 0.7px; }
    .hud-temp { font-size: 17px; font-weight: 800; margin-top: 2px; }
    .hud-meta { font-size: 12px; color: #ebf4fa; margin-top: 2px; }
    .hud-divider { height: 1px; background: rgba(255, 255, 255, 0.2); margin: 10px 0; }
    .hud-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
      background: rgba(18, 30, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .hud-controls { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
    .hud-controls button, .hud-controls input, .hud-controls select {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
    }
    .hud-controls select option { background: #142230; color: #fff; }
    .hud-controls input { flex: 1; min-width: 110px; cursor: text; }
    .location-badge {
      position: absolute;
      right: 16px;
      bottom: 14px;
      background: rgba(34, 48, 62, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      padding: 4px 11px;
      font-size: 11px;
      color: #eef6fc;
    }
    .camera-pill {
      display: none;
      position: absolute;
      left: 14px;
      bottom: 14px;
      gap: 4px;
      background: rgba(20, 34, 48, 0.76);
      border: 1px solid rgba(110, 168, 215, 0.45);
      border-radius: 16px;
      padding: 3px 8px;
      user-select: none;
    }
    .camera-pill button {
      background: transparent;
      border: none;
      color: #e6f2ff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 10px;
      cursor: pointer;
    }
    .camera-pill button:hover {
      background: rgba(59, 105, 144, 0.75);
    }
  </style>
</head>
<body>
  <div class="widget-frame">
    <canvas id="isoCanvas" width="1376" height="768"></canvas>

    <div class="hud-card" id="hudCard">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div class="hud-condition" id="hudCondition">CLEAR WEATHER</div>
        <div class="hud-clock" id="hudClock" style="font-size:13px; font-weight:800; color:#93c5fd; letter-spacing:0.5px;">--:-- --</div>
      </div>
      <div class="hud-temp" id="hudTemp">68°F (20°C)</div>
      <div class="hud-meta" id="hudHumidity">64% HUMIDITY</div>
      <div class="hud-meta" id="hudWind">8 MPH NNE WIND</div>
      <div class="hud-divider"></div>
      <div class="hud-meta" id="hudLoc">📍 YORKTOWN, VA • FEELS 67°F</div>
      <div class="hud-badges">
        <span class="pill" id="hudAqi" style="color:#4cd137">AQI 24 GOOD</span>
        <span class="pill" id="hudUv" style="color:#fbc531">UV 3.2</span>
        <span class="pill" id="hudMoon">🌔 Waxing Gibbous</span>
        <a id="hudForecastLink" target="_blank" rel="noopener noreferrer" class="pill" style="color:#60a5fa; text-decoration:none; cursor:pointer;" title="Open detailed 7-day weather forecast">🌐 7-Day Forecast ↗</a>
      </div>
      <div class="hud-controls">
        <input id="citySearch" type="text" placeholder="Search any city..." />
        <button id="btnSearch">Go</button>
        <button id="btnAutoLoc" title="Detect Current Computer Location">📍 My Loc</button>
        <select id="themeSelect" title="3D Isometric Diorama Scene (Independent of Weather Location)">
          <optgroup label="Historic Virginia &amp; Mid-Atlantic (NPS)">
            <option value="yorktown">🏛️ Historic Yorktown, VA (1781 Waterfront)</option>
            <option value="jamestown">⛵ Historic Jamestown, VA (1607 James Fort)</option>
            <option value="virginia_beach">🏖️ Virginia Beach, VA (Boardwalk &amp; Lighthouse)</option>
            <option value="norfolk">⚓ Norfolk &amp; Hampton Roads, VA (Waterside &amp; Battleship)</option>
            <option value="chesapeake_bay">🦀 Chesapeake Bay &amp; Bridge-Tunnel, VA</option>
            <option value="washington_dc">🏛️ Washington, D.C. (Capitol &amp; Tidal Basin)</option>
          </optgroup>
          <optgroup label="East Coast, South &amp; Florida">
            <option value="new_york">🗽 New York City &amp; Northeast</option>
            <option value="coastal">⚓ New England &amp; Maritime Harbor</option>
            <option value="myrtle_beach">🎡 Myrtle Beach &amp; Grand Strand, SC</option>
            <option value="atlanta">🏙️ Atlanta &amp; Georgia Piedmont</option>
            <option value="orlando">🏰 Orlando &amp; Theme Parks, FL</option>
            <option value="miami_caribbean">🌴 Miami Beach, Keys &amp; Tropics</option>
            <option value="new_orleans">🎷 New Orleans &amp; Gulf South</option>
          </optgroup>
          <optgroup label="Heartland, Mountains &amp; American West">
            <option value="texas">🤠 Texas Capitol, Austin &amp; Hill Country</option>
            <option value="chicago_great_lakes">🏙️ Chicago &amp; Great Lakes Midwest</option>
            <option value="denver">🏔️ Denver Mile High Skyline, CO</option>
            <option value="colorado_springs">⛰️ Colorado Springs &amp; Pikes Peak, CO</option>
            <option value="arizona">🌵 Arizona Sonoran Desert &amp; Sedona</option>
            <option value="grand_canyon">🏜️ Grand Canyon &amp; Southwest</option>
            <option value="las_vegas">🎰 Las Vegas Strip &amp; Mojave Oasis, NV</option>
            <option value="san_francisco">🌉 San Francisco &amp; California Coast</option>
            <option value="seattle_pnw">🌲 Seattle &amp; Pacific Northwest</option>
          </optgroup>
          <optgroup label="Global Capitals &amp; UNESCO Landmarks">
            <option value="london_uk">🕰️ London &amp; UK (Big Ben &amp; Tower)</option>
            <option value="paris_europe">🏰 Paris &amp; Western Europe (Notre-Dame &amp; Louvre)</option>
            <option value="rome_mediterranean">🏛️ Rome, Athens &amp; Mediterranean</option>
            <option value="cairo_giza">🏺 Cairo, Giza &amp; Middle East</option>
            <option value="tokyo_east_asia">⛩️ Tokyo, Kyoto &amp; East Asia</option>
            <option value="modern">🌆 Global Metropolis (Sydney / Singapore / Toronto)</option>
            <option value="alpine">🏔️ Alpine Mountain &amp; Lake Village</option>
          </optgroup>
        </select>
        <button id="btnTime">☀️ Time</button>
      </div>
    </div>

    <div class="camera-pill">
      <button id="camZoomOut" title="Zoom Out">➖</button>
      <button id="camZoomIn" title="Zoom In">➕</button>
      <button id="camPanLeft" title="Move Isometric Left">◀</button>
      <button id="camCenter" title="Center Isometric">🎯</button>
      <button id="camPanRight" title="Move Isometric Right">▶</button>
    </div>

    <div class="location-badge" id="locBadge">Yorktown, VA • 3D Isometric</div>
  </div>

  <script type="module">
    import { IsometricWeatherEngine } from "./isometric-weather.js";

    function updateLiveClock() {
      const now = new Date();
      const clockEl = document.getElementById("hudClock");
      if (clockEl) {
        clockEl.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      }
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function getForecastUrl(lat, lon) {
      if (lat >= 24 && lat <= 50 && lon >= -125 && lon <= -66) {
        return `https://forecast.weather.gov/MapClick.php?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`;
      }
      return `https://weather.com/weather/today/l/${lat.toFixed(4)},${lon.toFixed(4)}`;
    }

    const canvas = document.getElementById("isoCanvas");
    const engine = new IsometricWeatherEngine(canvas, {
      onHudUpdate: (st) => {
        const c = Math.round((st.tempF - 32) * 5 / 9);
        document.getElementById("hudTemp").textContent = `${Math.round(st.tempF)}°F (${c}°C)`;
        document.getElementById("hudHumidity").textContent = `${st.humidity}% HUMIDITY`;
        document.getElementById("hudWind").textContent = `${Math.round(st.windMph)} MPH WIND`;
        document.getElementById("hudLoc").textContent = `📍 ${st.locationName.toUpperCase()} • FEELS ${Math.round(st.feelsLikeF)}°F`;
        document.getElementById("hudAqi").textContent = `AQI ${st.usAqi}`;
        document.getElementById("hudUv").textContent = `UV ${st.uvIndex.toFixed(1)}`;
        const moon = engine.computeMoonPhase();
        document.getElementById("hudMoon").textContent = `${moon.emoji} ${moon.name}`;
        document.getElementById("locBadge").textContent = `${st.locationName} • 3D Isometric`;

        const fUrl = getForecastUrl(st.latitude, st.longitude);
        const fLink = document.getElementById("hudForecastLink");
        if (fLink) {
          fLink.href = fUrl;
        }
      }
    });
    window.isoEngine = engine;

    engine.start();
    engine.refreshAll();

    document.getElementById("btnTime").addEventListener("click", () => {
      const modes = ["realtime", "day", "sunset", "night"];
      engine.state.timeMode = modes[(modes.indexOf(engine.state.timeMode) + 1) % modes.length];
    });

    document.getElementById("themeSelect").addEventListener("change", (e) => {
      engine.setDioramaTheme(e.target.value);
      engine.onHudUpdate(engine.state);
    });

    document.getElementById("btnSearch").addEventListener("click", async () => {
      const q = document.getElementById("citySearch").value.trim();
      if (q.length < 2) return;
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
      const data = await res.json();
      if (data.results && data.results.length > 0) {
        const r = data.results[0];
        engine.state.locationName = `${r.name}${r.admin1 ? ", " + r.admin1 : ""}`;
        engine.state.latitude = r.latitude;
        engine.state.longitude = r.longitude;
        await engine.refreshAll();
      }
    });

    document.getElementById("btnAutoLoc").addEventListener("click", async () => {
      try {
        const res = await fetch("https://get.geojs.io/v1/ip/geo.json");
        const data = await res.json();
        if (data && data.latitude && data.longitude) {
          const lat = parseFloat(data.latitude);
          const lon = parseFloat(data.longitude);
          const city = data.city || "Current Location";
          const region = data.region ? `, ${data.region}` : "";
          engine.state.locationName = `${city}${region}`;
          engine.state.latitude = lat;
          engine.state.longitude = lon;
          await engine.refreshAll();
        }
      } catch (e) {
        console.error("Auto-detect failed:", e);
      }
    });
  </script>
</body>
</html>
